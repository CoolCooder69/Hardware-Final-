<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pet Feeder</title>
<style>
  :root { --bg:#fdf6ff; --card:#ffffff; --ink:#2d2340; --muted:#7a6f8f; --line:#eadff5;
          --ready:#22c55e; --busy:#f59e0b; --err:#ef4444;
          --p1:#7c3aed; --p2:#ec4899; --p3:#f59e0b; --state:var(--ready); }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#17122a; --card:#231b3d; --ink:#f4efff; --muted:#a99fc4; --line:#34295a; } }
  body[data-state="dispensing"] { --state:var(--busy); }
  body[data-state="error"] { --state:var(--err); }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.45 system-ui, sans-serif; }
  header { padding:22px 16px 56px; color:#fff; text-align:center;
           background:linear-gradient(135deg,var(--p1),var(--p2) 55%,var(--p3)); }
  header h1 { margin:0; font-size:24px; letter-spacing:.06em; }
  #badge { display:inline-block; margin-top:8px; padding:4px 12px; border-radius:999px;
           background:rgba(255,255,255,.25); font-size:14px; }
  main { max-width:480px; margin:-40px auto 24px; padding:0 14px; display:grid; gap:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:18px;
          box-shadow:0 6px 18px rgba(124,58,237,.12); }
  h2 { margin:0 0 12px; font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; }
  .hero { display:flex; align-items:center; justify-content:space-around; gap:6px; }
  .row { display:flex; justify-content:space-between; gap:10px; padding:5px 0; }
  .row span:first-child { color:var(--muted); }
  .dot { display:inline-block; width:11px; height:11px; border-radius:50%; background:var(--state);
         margin-right:7px; box-shadow:0 0 0 4px color-mix(in srgb, var(--state) 25%, transparent); }
  #status { color:var(--state); font-weight:700; }

  /* dog + gauge */
  #dog .m { display:none; }
  #dog[data-mood="idle"] .idle, #dog[data-mood="happy"] .happy, #dog[data-mood="eat"] .eat,
  #dog[data-mood="sad"] .sad, #dog[data-mood="sleep"] .sleep { display:inline; }
  .ring-bg { fill:none; stroke:var(--line); stroke-width:10; }
  .ring { fill:none; stroke:var(--state); stroke-width:10; stroke-linecap:round;
          stroke-dasharray:326.7; stroke-dashoffset:326.7; transition:stroke-dashoffset .4s, stroke .3s; }
  .gnum { font-size:26px; font-weight:700; fill:var(--ink); }
  .gsub { font-size:11px; fill:var(--muted); }
  @keyframes bob { 50% { transform:translateY(3px); } }
  @keyframes fall { from { transform:translateY(-4px); opacity:1; } to { transform:translateY(42px); opacity:.2; } }
  @keyframes zz { 50% { transform:translateY(-5px); opacity:.5; } }
  @keyframes tear { from { transform:translateY(0); } to { transform:translateY(14px); } }
  @keyframes beat { 50% { transform:scale(1.3); } }
  #dog[data-mood="eat"] .bob { animation:bob .35s ease-in-out infinite; }
  .kib circle { animation:fall .9s linear infinite; }
  .kib circle:nth-child(2) { animation-delay:.3s; } .kib circle:nth-child(3) { animation-delay:.6s; }
  .z { animation:zz 2s ease-in-out infinite; }
  .tear { animation:tear 1.2s linear infinite; }
  .heart { transform-box:fill-box; transform-origin:center; animation:beat .6s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }

  /* controls */
  button { font:inherit; border:0; border-radius:14px; cursor:pointer; padding:12px 16px;
           background:var(--line); color:var(--ink); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .chips { display:flex; gap:8px; margin-bottom:12px; }
  .chip { flex:1; color:#fff; font-weight:700; }
  .c1 { background:#06b6d4; } .c2 { background:#8b5cf6; } .c3 { background:#22c55e; }
  .portion { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .portion input, .add input { flex:1; min-width:0; text-align:center; font:inherit; font-size:24px; padding:10px;
        border-radius:14px; border:2px solid var(--line); background:var(--bg); color:var(--ink); }
  .add input { font-size:17px; }
  .big { width:100%; padding:22px; font-size:24px; font-weight:800; color:#fff; letter-spacing:.04em;
         background:linear-gradient(135deg,#f59e0b,#ec4899); box-shadow:0 8px 18px rgba(236,72,153,.35); }
  #msg { min-height:1.4em; color:var(--muted); margin-top:8px; }
  .sched { display:flex; align-items:center; gap:8px; padding:10px 0; border-top:1px solid var(--line); }
  .pill { background:linear-gradient(135deg,var(--p1),var(--p2)); color:#fff; font-weight:700;
          padding:6px 12px; border-radius:999px; }
  .sched .info { flex:1; color:var(--muted); }
  .on { background:#22c55e; color:#fff; } .off { background:#9ca3af; color:#fff; }
  .del { background:#fee2e2; color:#b91c1c; }
  .add { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .add button { background:var(--p1); color:#fff; font-weight:700; }
  table { width:100%; border-collapse:collapse; font-size:15px; }
  td { padding:7px 4px; border-top:1px solid var(--line); }
  .b { padding:2px 9px; border-radius:999px; font-size:13px; font-weight:700; color:#fff; }
  .b.ok { background:#22c55e; } .b.warn { background:#f59e0b; } .b.bad { background:#ef4444; }
</style>
</head>
<body data-state="ready">
<header>
  <h1>PET FEEDER</h1>
  <div id="badge">connecting...</div>
</header>
<main>
  <section class="card hero">
    <svg id="dog" data-mood="idle" viewBox="0 0 120 130" width="130" height="140" role="img" aria-label="Dog">
      <g class="m eat kib"><circle cx="50" cy="6" r="3" fill="#b45309"/><circle cx="62" cy="0" r="3" fill="#d97706"/><circle cx="73" cy="8" r="3" fill="#b45309"/></g>
      <g class="bob">
        <ellipse cx="22" cy="58" rx="14" ry="27" fill="#8d5524"/>
        <ellipse cx="98" cy="58" rx="14" ry="27" fill="#8d5524"/>
        <ellipse cx="60" cy="64" rx="38" ry="36" fill="#e0a96d"/>
        <ellipse cx="60" cy="80" rx="21" ry="16" fill="#f8e3c5"/>
        <ellipse cx="60" cy="71" rx="7.5" ry="5.5" fill="#3b2a20"/>
        <g class="m idle eat"><circle cx="45" cy="56" r="4.5" fill="#2b1d14"/><circle cx="75" cy="56" r="4.5" fill="#2b1d14"/>
          <circle cx="46.5" cy="54.5" r="1.4" fill="#fff"/><circle cx="76.5" cy="54.5" r="1.4" fill="#fff"/></g>
        <g class="m happy" fill="none" stroke="#2b1d14" stroke-width="3" stroke-linecap="round">
          <path d="M38 58 Q45 49 52 58"/><path d="M68 58 Q75 49 82 58"/></g>
        <g class="m sleep" stroke="#2b1d14" stroke-width="3" stroke-linecap="round">
          <path d="M39 57 H51"/><path d="M69 57 H81"/></g>
        <g class="m sad"><circle cx="45" cy="57" r="4.5" fill="#2b1d14"/><circle cx="75" cy="57" r="4.5" fill="#2b1d14"/>
          <path d="M37 47 L52 42 M68 42 L83 47" stroke="#2b1d14" stroke-width="3" stroke-linecap="round"/></g>
        <path class="m idle sleep" d="M50 82 Q55 90 60 82 Q65 90 70 82" fill="none" stroke="#3b2a20" stroke-width="2.5" stroke-linecap="round"/>
        <g class="m happy eat"><ellipse cx="60" cy="87" rx="9" ry="7" fill="#7a2e2e"/><ellipse cx="60" cy="91" rx="5" ry="3.5" fill="#ff7a90"/></g>
        <path class="m sad" d="M50 90 Q60 81 70 90" fill="none" stroke="#3b2a20" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M30 100 Q60 117 90 100" fill="none" stroke="#ef4444" stroke-width="7" stroke-linecap="round"/>
        <circle cx="60" cy="112" r="6" fill="#fbbf24"/>
      </g>
      <g class="m happy"><text class="heart" x="6" y="26" font-size="17" fill="#ec4899">&#9829;</text>
        <text class="heart" x="98" y="20" font-size="14" fill="#f43f5e">&#9829;</text></g>
      <text class="m sleep z" x="92" y="24" font-size="16" font-weight="700" fill="#8b5cf6">z Z</text>
      <ellipse class="m sad tear" cx="84" cy="64" rx="2.5" ry="3.5" fill="#38bdf8"/>
    </svg>
    <svg viewBox="0 0 120 120" width="130" height="130" role="img" aria-label="Grams poured">
      <circle class="ring-bg" cx="60" cy="60" r="52"/>
      <circle id="ring" class="ring" cx="60" cy="60" r="52" transform="rotate(-90 60 60)"/>
      <text id="gnum" class="gnum" x="60" y="64" text-anchor="middle">0</text>
      <text id="gsub" class="gsub" x="60" y="82" text-anchor="middle">grams</text>
    </svg>
  </section>

  <section class="card">
    <div class="row"><span>Status</span><span><i class="dot"></i><b id="status">...</b></span></div>
    <div class="row"><span>Detail</span><span id="detail">-</span></div>
    <div class="row"><span>Next feed</span><b id="next">-</b></div>
    <div class="row"><span>Last feed</span><span id="last">-</span></div>
  </section>

  <section class="card">
    <h2>Feed now</h2>
    <div class="chips">
      <button class="chip c1" data-g="40">40 g</button>
      <button class="chip c2" data-g="80">80 g</button>
      <button class="chip c3" data-g="120">120 g</button>
    </div>
    <div class="portion">
      <button id="minus" aria-label="Less">&minus;</button>
      <input id="grams" type="number" inputmode="numeric" min="5" step="5" value="80">
      <button id="plus" aria-label="More">+</button>
    </div>
    <button class="big" id="feed">FEED NOW</button>
    <div id="msg" role="status"></div>
  </section>

  <section class="card">
    <h2>Daily schedule</h2>
    <div id="schedules"></div>
    <div class="add">
      <input id="newTime" type="time" value="12:00">
      <input id="newGrams" type="number" inputmode="numeric" min="5" step="5" value="80">
      <button id="addBtn">Add</button>
    </div>
  </section>

  <section class="card">
    <h2>Recent feedings</h2>
    <table id="log"></table>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const api = async (url, method = "GET", body) => {
  const r = await fetch(url, { method, headers: {"Content-Type": "application/json"},
    body: body ? JSON.stringify(body) : undefined });
  return { status: r.status, data: await r.json() };
};
const say = t => { $("msg").textContent = t; };
const C = 326.7;
let lastStatus = "", happyUntil = 0, timer = null;

function moodOf(s) {
  if (s.status === "Dispensing") return "eat";
  if (s.status === "Error") return "sad";
  if (Date.now() < happyUntil) return "happy";
  const h = parseInt((s.now || "12").slice(0, 2), 10);
  return (h >= 22 || h < 6) ? "sleep" : "idle";
}

async function refreshStatus() {
  let delay = 2000;
  try {
    const { data: s } = await api("/api/status");
    if (lastStatus === "Dispensing" && s.status === "Ready") happyUntil = Date.now() + 8000;
    lastStatus = s.status;
    document.body.dataset.state = s.status.toLowerCase();
    $("dog").dataset.mood = moodOf(s);
    $("status").textContent = s.status;
    $("detail").textContent = s.message || "-";
    $("next").textContent = s.next_feed || "No schedule";
    $("last").textContent = s.last_feed ? `${s.last_feed.slice(5, 16)} (${s.last_amount} g)` : "-";
    $("feed").disabled = s.status === "Dispensing";
    $("grams").max = s.max_portion;
    $("badge").textContent = s.mode === "weighed" ? "Weighed mode - live scale" : "Timed mode - estimated";
    const target = s.target || 0, poured = s.poured || 0;
    const frac = target ? Math.min(1, poured / target) : 0;
    $("ring").style.strokeDashoffset = C * (1 - frac);
    $("gnum").textContent = (s.estimated ? "~" : "") + Math.round(poured);
    $("gsub").textContent = target ? `of ${Math.round(target)} g` : "grams";
    if (s.status === "Dispensing") delay = 500;
  } catch {
    $("status").textContent = "Offline";
    document.body.dataset.state = "error";
    delay = 3000;
  }
  clearTimeout(timer);
  timer = setTimeout(refreshStatus, delay);
}

async function refreshSchedules() {
  const { data } = await api("/api/schedule");
  const box = $("schedules");
  box.replaceChildren();
  data.forEach(s => {
    const row = document.createElement("div"); row.className = "sched";
    const pill = document.createElement("span"); pill.className = "pill"; pill.textContent = s.time;
    const info = document.createElement("span"); info.className = "info"; info.textContent = `${s.grams} g`;
    const tog = document.createElement("button");
    tog.className = s.enabled ? "on" : "off"; tog.textContent = s.enabled ? "On" : "Off";
    tog.onclick = async () => {
      await api(`/api/schedule/${s.id}/toggle`, "POST", { enabled: !s.enabled });
      refreshSchedules(); refreshStatus(); };
    const del = document.createElement("button");
    del.className = "del"; del.textContent = "Delete";
    del.onclick = async () => {
      await api(`/api/schedule/${s.id}`, "DELETE");
      refreshSchedules(); refreshStatus(); };
    row.append(pill, info, tog, del); box.appendChild(row);
  });
}

const resClass = r => r.startsWith("ok") ? "ok" : r === "timeout" ? "warn" : "bad";
async function refreshLog() {
  const { data } = await api("/api/log");
  const t = $("log"); t.replaceChildren();
  data.slice(0, 8).forEach(e => {
    const tr = document.createElement("tr");
    [e.time.slice(5, 16), e.source, `${e.actual_g}/${e.target_g} g`].forEach(v => {
      const td = document.createElement("td"); td.textContent = v; tr.appendChild(td); });
    const td = document.createElement("td");
    const b = document.createElement("span");
    b.className = "b " + resClass(e.result); b.textContent = e.result;
    td.appendChild(b); tr.appendChild(td); t.appendChild(tr);
  });
}

document.querySelectorAll(".chip").forEach(c => c.onclick = () => { $("grams").value = c.dataset.g; });
$("minus").onclick = () => $("grams").value = Math.max(5, +$("grams").value - 10);
$("plus").onclick = () => $("grams").value = +$("grams").value + 10;
$("feed").onclick = async () => {
  const { data } = await api("/api/feed", "POST", { grams: +$("grams").value });
  say(data.message); refreshStatus();
};
$("addBtn").onclick = async () => {
  const { data } = await api("/api/schedule", "POST",
    { time: $("newTime").value, grams: +$("newGrams").value });
  say(data.ok ? "Schedule added" : data.message);
  refreshSchedules(); refreshStatus();
};

refreshStatus(); refreshSchedules(); refreshLog();
setInterval(refreshLog, 5000);
</script>
</body>
</html>
